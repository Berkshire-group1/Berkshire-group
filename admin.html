<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Berkshire Group Admin</title><style>body{font:16px system-ui;background:#f4f6f8;color:#20252b;margin:0}main{max-width:1100px;margin:35px auto;padding:16px}.panel{background:white;border:1px solid #d8dee5;border-radius:12px;padding:20px;margin-bottom:16px}input,button,select{font:inherit;padding:10px;margin:5px;border:1px solid #aab4bf;border-radius:6px}button{background:#20384d;color:white;cursor:pointer}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#65717e}</style></head><body><main><section class="panel"><h1>Employment applications</h1><p class="muted">Restricted to authenticated users explicitly listed in employment_admins.</p><p id="msg" role="status"></p><div id="login"><input id="email" type="email" placeholder="Administrator email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="sign">Sign in</button></div><div id="session" class="hidden"><span id="who"></span><button id="refresh">Refresh</button><button id="out">Sign out</button></div></section><section id="list" class="panel hidden"><h2>Applications</h2><table><thead><tr><th>Submitted</th><th>Applicant</th><th>Position</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></section><section id="detail" class="panel hidden"><h2>Review</h2><div id="details"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const URL="https://mkgtsivgmqicxedaewoj.supabase.co",KEY="REPLACE_WITH_SUPABASE_PUBLISHABLE_KEY",B="employment-documents",$=x=>document.getElementById(x),say=t=>$("msg").textContent=t;if(KEY.includes("REPLACE_")){say("Setup needed: add the Supabase publishable key in this file.");return;}const db=window.supabase.createClient(URL,KEY);const el=(tag,t)=>{const x=document.createElement(tag);x.textContent=t??"";return x;};async function admin(){const {data:{user}}=await db.auth.getUser();if(!user){$("login").classList.remove("hidden");$("session").classList.add("hidden");$("list").classList.add("hidden");return;}const {data}=await db.from("employment_admins").select("user_id").eq("user_id",user.id).maybeSingle();if(!data){await db.auth.signOut();say("This account is not authorized.");return;} $("login").classList.add("hidden");$("session").classList.remove("hidden");$("list").classList.remove("hidden");$("who").textContent=user.email;await load();}
async function load(){const {data,error}=await db.from("employment_applications").select("*").order("created_at",{ascending:false}).limit(200);if(error){say("Could not load applications; check administrator membership.");return;}const body=$("rows");body.replaceChildren();for(const a of data||[]){const tr=el("tr","");for(const t of [new Date(a.created_at).toLocaleString(),a.first_name+" "+a.last_name,a.position_applied_for||"—",a.status])tr.appendChild(el("td",t));const td=el("td","");const b=el("button","Review");b.onclick=()=>show(a);td.appendChild(b);tr.appendChild(td);body.appendChild(tr);}say((data||[]).length+" applications loaded.");}
async function show(a){const root=$("details");root.replaceChildren();$("detail").classList.remove("hidden");root.appendChild(el("p","Reference: "+a.id));const sel=document.createElement("select");for(const s of ["new","in_review","interview","hired","rejected"]){const o=el("option",s);o.value=s;sel.appendChild(o);}sel.value=a.status;root.appendChild(sel);const save=el("button","Save status");save.onclick=async()=>{const {error}=await db.rpc("set_employment_application_status",{application_id:a.id,new_status:sel.value});say(error?"Could not update status.":"Status saved.");if(!error)load();};root.appendChild(save);root.appendChild(el("h3","Application details"));root.appendChild(el("pre",JSON.stringify(a.application_data,null,2)));const {data:s}=await db.from("employment_sensitive").select("*").eq("application_id",a.id).maybeSingle();if(s)root.appendChild(el("pre",JSON.stringify(s,null,2)));root.appendChild(el("h3","ID documents"));for(const [label,path] of [["Front",a.id_front_path],["Back",a.id_back_path]]){if(!path)continue;const {data,error}=await db.storage.from(B).createSignedUrl(path,60);if(error||!data?.signedUrl){root.appendChild(el("p",label+" document unavailable"));continue;}const link=el("a",label+" of ID (60-second link)");link.href=data.signedUrl;link.target="_blank";link.rel="noopener noreferrer";root.appendChild(link);root.appendChild(el("br",""));}}
$("sign").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){say("Sign-in failed.");return;}await admin();};$("out").onclick=async()=>{await db.auth.signOut();await admin();};$("refresh").onclick=load;db.auth.getSession().then(({data})=>{if(data.session)admin();});})();
</script></body></html>
